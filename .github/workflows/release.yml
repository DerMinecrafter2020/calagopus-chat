name: Release Calagopus Chat

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if match is None:
              raise SystemExit(f"Tag {tag!r} must use the form vMAJOR.MINOR.PATCH")

          version = ".".join(match.groups())
          extension = "backend-extensions/com_calagopus_chat"
          with open(f"{extension}/Cargo.toml", "rb") as manifest_file:
              cargo_version = tomllib.load(manifest_file)["package"]["version"]
          with open(f"{extension}/frontend/package.json", encoding="utf-8") as package_file:
              frontend_version = json.load(package_file)["version"]

          if cargo_version != version:
              raise SystemExit(f"Tag version {version} does not match Cargo.toml version {cargo_version}")
          if frontend_version != version:
              raise SystemExit(
                  f"Tag version {version} does not match frontend/package.json version {frontend_version}"
              )

          print(f"Validated release version {version}")
          PY

      - name: Build .c7s.zip archive
        shell: bash
        run: |
          set -euo pipefail

          source_dir="backend-extensions/com_calagopus_chat"
          stage_dir="$RUNNER_TEMP/com_calagopus_chat"
          archive="$GITHUB_WORKSPACE/com_calagopus_chat.c7s.zip"

          mkdir -p "$stage_dir/backend" "$stage_dir/frontend" "$stage_dir/migrations"
          cp "$source_dir/Metadata.toml" "$stage_dir/Metadata.toml"
          cp "$source_dir/Cargo.toml" "$stage_dir/backend/Cargo.toml"
          cp -R "$source_dir/src" "$stage_dir/backend/src"
          cp "$source_dir/frontend/package.json" "$stage_dir/frontend/package.json"
          cp -R "$source_dir/frontend/src" "$stage_dir/frontend/src"
          cp -R "$source_dir/migrations/." "$stage_dir/migrations/"

          rm -f "$archive"
          (
            cd "$stage_dir"
            zip -q -r "$archive" Metadata.toml backend frontend migrations
          )

          unzip -t "$archive"
          python - "$archive" <<'PY'
          import sys
          import zipfile

          archive_path = sys.argv[1]
          with zipfile.ZipFile(archive_path) as archive:
              names = set(archive.namelist())
          required = {
              "Metadata.toml",
              "backend/",
              "backend/Cargo.toml",
              "backend/src/",
              "backend/src/lib.rs",
              "frontend/",
              "frontend/src/",
              "frontend/package.json",
              "frontend/src/index.ts",
              "migrations/",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Archive is missing required entries: " + ", ".join(missing))
          up_files = sorted(
              name for name in names
              if name.startswith("migrations/") and name.endswith("/up.sql")
          )
          if not up_files:
              raise SystemExit("Archive does not contain a migration up.sql file")
          for up_file in up_files:
              down_file = up_file.rsplit("/", 1)[0] + "/down.sql"
              if down_file not in names:
                  raise SystemExit(f"Migration {up_file!r} is missing {down_file!r}")
          if "frontend/tsconfig.json" in names:
              raise SystemExit("Do not ship frontend/tsconfig.json; Calagopus generates it on install")
          print(f"Validated {archive_path}")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Calagopus Chat ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: com_calagopus_chat.c7s.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
